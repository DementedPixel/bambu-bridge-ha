name: Build Add-on

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  info:
    name: Gather add-on info
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get add-on info
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./bambu-bridge"

  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: "./bambu-bridge"

  build:
    name: Build ${{ matrix.architecture }}
    needs:
      - info
      - lint
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.info.outputs.architectures) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on
        if: github.event_name != 'pull_request'
        uses: home-assistant/builder@master
        with:
          args: --${{ matrix.architecture }} --target /data/bambu-bridge --no-cache --docker-hub-check

      - name: Build add-on (test only)
        if: github.event_name == 'pull_request'
        uses: home-assistant/builder@master
        with:
          args: --test --${{ matrix.architecture }} --target /data/bambu-bridge --no-cache --docker-hub-check
