name: Build Add-on

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  BUILD_ARGS: "--test"

jobs:
  info:
    name: Gather add-on info
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build: ${{ steps.info.outputs.build }}
      description: ${{ steps.info.outputs.description }}
      name: ${{ steps.info.outputs.name }}
      slug: ${{ steps.info.outputs.slug }}
      target: ${{ steps.info.outputs.target }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get add-on info
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./bambu-bridge"

  lint:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: "./bambu-bridge"

  build:
    name: Build ${{ matrix.architecture }}
    needs:
      - info
      - lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.info.outputs.architectures) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on
        uses: home-assistant/builder@master
        with:
          args: |
            ${{ env.BUILD_ARGS }}
            --${{ matrix.architecture }}
            --target /data/bambu-bridge
            --image "ghcr.io/${{ github.repository_owner }}/bambu-bridge-{arch}"
            --docker-hub-check

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish add-on images
        uses: home-assistant/builder@master
        with:
          args: |
            --all
            --target /data/bambu-bridge
            --image "ghcr.io/${{ github.repository_owner }}/bambu-bridge-{arch}"
